[project]
name = "cloud-courier-infrastructure"
version = "0.1.0"
description = "Managing the Cloud Infrastructure for a Cloud Courier deployment"

readme = "README.md"
requires-python = ">=3.12.11"

dependencies = [
    # Specific to this template



    # Managed by upstream template
    "pulumi>=3.234.0",
    "pulumi-aws>=7.28.0",
    "pulumi-aws-native>=1.63.0",
    "pulumi-command>=1.2.1",
    "ephemeral-pulumi-deploy>=0.0.6",
    "boto3>=1.42.92",
    "pydantic>=2.13.4",
]


[dependency-groups]
dev = [
    # Specific to this template



    # Managed by upstream template
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "boto3-stubs[all]>=1.43.21",
]



[tool.uv]
package = true
