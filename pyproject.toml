[project]
name = "cloud-courier-infrastructure"
version = "0.1.0"
description = "Managing the Cloud Infrastructure for a Cloud Courier deployment"

readme = "README.md"
requires-python = ">=3.12.7"

dependencies = [
    # Specific to this template



    # Managed by upstream template
    "pulumi>=3.223.0",
    "pulumi-aws>=7.20.0",
    "pulumi-aws-native>=1.54.0",
    "pulumi-command>=1.1.3",
    "ephemeral-pulumi-deploy>=0.0.6",
    "boto3>=1.42.53",
    "pydantic>=2.12.5",
]


[dependency-groups]
dev = [
    # Specific to this template



    # Managed by upstream template
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=4.0.1",
    "boto3-stubs[all]>=1.42.53",
]



[tool.uv]
package = true
